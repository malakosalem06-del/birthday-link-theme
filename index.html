<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Comic Sans MS", system-ui, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #ffb6e6 0, #ff6fb5 40%, #ff914d 100%);
      overflow: hidden;
    }

    .card {
      position: relative;
      width: 90%;
      max-width: 700px;
      padding: 40px 30px 60px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .title {
      font-size: 3rem;
      color: #ff4f9a;
      text-shadow: 0 0 10px rgba(255, 79, 154, 0.7);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #ff7a2f;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .custom-bday {
      font-size: 2rem;
      color: #ff7a2f;
      font-weight: bold;
      margin: 15px 0 25px;
      text-shadow: 0 0 8px rgba(255, 122, 47, 0.6);
    }

    .cheetos-chip {
      position: absolute;
      width: 70px;
      height: 30px;
      background: linear-gradient(135deg, #ffb347, #ff7a2f);
      border-radius: 40px;
      box-shadow: 0 0 10px rgba(255, 122, 47, 0.7);
      transform: rotate(-15deg);
    }

    .cheetos-chip::after {
      content: "";
      position: absolute;
      inset: 5px 10px;
      border-radius: 40px;
      background: radial-gradient(circle at 20% 20%, #ffd9a3 0, transparent 50%),
                  radial-gradient(circle at 70% 60%, #ffd9a3 0, transparent 50%);
      opacity: 0.9;
    }

    .chip-1 { top: -20px; left: 10%; transform: rotate(-20deg); }
    .chip-2 { top: 10px; right: 5%; transform: rotate(15deg); }
    .chip-3 { bottom: 0; left: 20%; transform: rotate(10deg); }
    .chip-4 { bottom: -10px; right: 15%; transform: rotate(-10deg); }

    .balloons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .balloon {
      width: 60px;
      height: 80px;
      border-radius: 50% 50% 45% 45%;
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .balloon::after {
      content: "";
      position: absolute;
      bottom: -35px;
      left: 50%;
      width: 2px;
      height: 35px;
      background: #ff7a2f;
      transform: translateX(-50%);
    }

    .balloon.pink {
      background: radial-gradient(circle at 30% 20%, #ffe6f5 0, #ff4f9a 60%);
    }

    .balloon.orange {
      background: radial-gradient(circle at 30% 20%, #ffe0c2 0, #ff7a2f 60%);
    }

    .balloon.yellow {
      background: radial-gradient(circle at 30% 20%, #fff7c2 0, #ffc94d 60%);
    }

    .balloon:nth-child(1) { animation-delay: 0s; }
    .balloon:nth-child(2) { animation-delay: 0.5s; }
    .balloon:nth-child(3) { animation-delay: 1s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .message {
      font-size: 1rem;
      color: #ff4f9a;
      margin-bottom: 20px;
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 16px;
      background: #ff4f9a;
      opacity: 0.9;
      animation: fall 4s linear infinite;
    }

    .confetti-piece.orange { background: #ff7a2f; }
    .confetti-piece.yellow { background: #ffd54f; }

    @keyframes fall {
      0% { transform: translateY(-100vh) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }

    .button {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ff4f9a, #ff7a2f);
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    .button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div class="confetti" id="confetti"></div>

  <div class="card">
    <div class="cheetos-chip chip-1"></div>
    <div class="cheetos-chip chip-2"></div>
    <div class="cheetos-chip chip-3"></div>
    <div class="cheetos-chip chip-4"></div>

    <h1 class="title">Happy Birthday!</h1>
    <p class="subtitle">Pink vibes & Cheetos energy 🎉</p>

    <h2 class="custom-bday">Happy 20th Birthday Lojainaaa!! 🎉💖</h2>

    <div class="balloons">
      <div class="balloon pink"></div>
      <div class="balloon orange"></div>
      <div class="balloon yellow"></div>
    </div>

    <p class="message">
      Wishing you a day as bright, fun, and crunchy as a bag of Cheetos in a pink universe. 💖🧡
    </p>

    <button class="button" onclick="burstConfetti()">
      Celebrate again ✨
    </button>
  </div>

  <script>
    function createConfetti() {
      const confettiContainer = document.getElementById("confetti");
      confettiContainer.innerHTML = "";

      const colors = ["pink", "orange", "yellow"];
      const pieces = 80;

      for (let i = 0; i < pieces; i++) {
        const piece = document.createElement("div");
        piece.classList.add("confetti-piece");

        const colorClass = colors[Math.floor(Math.random() * colors.length)];
        if (colorClass !== "pink") {
          piece.classList.add(colorClass);
        }

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.animationDelay = Math.random() * 4 + "s";
        piece.style.opacity = 0.6 + Math.random() * 0.4;
        piece.style.transform = "translateY(-100vh)";

        confettiContainer.appendChild(piece);
      }
    }

    function burstConfetti() {
      createConfetti();
    }

    createConfetti();
  </script>
</body>
</html>

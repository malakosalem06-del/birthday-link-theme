<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Birthday!</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ffb6e6, #ff6fb5, #ff914d);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.85);
      padding: 40px;
      border-radius: 30px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: popIn 1.2s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .title {
      font-size: 3.2rem;
      color: #ff4f9a;
      text-shadow: 0 0 15px rgba(255, 79, 154, 0.7);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .custom-bday {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ff7a2f;
      margin-bottom: 20px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff7a2f; }
      to { text-shadow: 0 0 25px #ffb347; }
    }

    .subtitle {
      font-size: 1.2rem;
      color: #ff4f9a;
      margin-bottom: 25px;
      font-weight: 600;
    }

    /* Modern balloons */
    .balloons {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 25px;
    }

    .balloon {
      width: 70px;
      height: 90px;
      border-radius: 50% 50% 45% 45%;
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .balloon::after {
      content: "";
      position: absolute;
      bottom: -40px;
      left: 50%;
      width: 3px;
      height: 40px;
      background: #ff7a2f;
      transform: translateX(-50%);
    }

    .pink { background: radial-gradient(circle at 30% 20%, #ffe6f5, #ff4f9a); }
    .orange { background: radial-gradient(circle at 30% 20%, #ffd9b3, #ff7a2f); }
    .yellow { background: radial-gradient(circle at 30% 20%, #fff7c2, #ffc94d); }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 18px;
      background: #ff4f9a;
      animation: fall 4s linear infinite;
      opacity: 0.9;
    }

    .orange { background: #ff7a2f !important; }
    .yellow { background: #ffd54f !important; }

    @keyframes fall {
      0% { transform: translateY(-100vh) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }

    /* Cheetos-inspired crunchy shapes */
    .cheeto {
      position: absolute;
      width: 80px;
      height: 35px;
      background: linear-gradient(135deg, #ffb347, #ff7a2f);
      border-radius: 40px;
      box-shadow: 0 0 15px rgba(255, 122, 47, 0.7);
      transform: rotate(-20deg);
      animation: wiggle 3s infinite ease-in-out;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-20deg); }
      50% { transform: rotate(-10deg); }
    }

    .c1 { top: -20px; left: 10%; }
    .c2 { top: 10px; right: 5%; }
    .c3 { bottom: -10px; left: 20%; }
    .c4 { bottom: -20px; right: 15%; }

    /* Button */
    .button {
      padding: 12px 25px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff4f9a, #ff7a2f);
      color: white;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 20px;
      font-size: 1rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 25px rgba(0,0,0,0.3);
    }

  </style>
</head>

<body>

  <div class="confetti" id="confetti"></div>

  <div class="card">

    <!-- Cheetos-inspired shapes -->
    <div class="cheeto c1"></div>
    <div class="cheeto c2"></div>
    <div class="cheeto c3"></div>
    <div class="cheeto c4"></div>

    <h1 class="title">🎉 Happy Birthday! 🎉</h1>
    <h2 class="custom-bday">Happy 20th Birthday Lojainaaa!! 💖🔥🧡</h2>
    <p class="subtitle">Pink vibes, Cheetos crunch, computer sparkles, and endless celebration 🎀✨💻🔥</p>

    <!-- Balloons -->
    <div class="balloons">
      <div class="balloon pink"></div>
      <div class="balloon orange"></div>
      <div class="balloon yellow"></div>
      <div class="balloon pink"></div>
      <div class="balloon orange"></div>
    </div>

    <button class="button" onclick="burstConfetti()">Celebrate Again 🎉🔥</button>

  </div>

  <script>
    function createConfetti() {
      const confettiContainer = document.getElementById("confetti");
      confettiContainer.innerHTML = "";

      const colors = ["pink", "orange", "yellow"];
      const pieces = 120;

      for (let i = 0; i < pieces; i++) {
        const piece = document.createElement("div");
        piece.classList.add("confetti-piece");

        const colorClass = colors[Math.floor(Math.random() * colors.length)];
        if (colorClass !== "pink") piece.classList.add(colorClass);

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.animationDelay = Math.random() * 4 + "s";
        piece.style.opacity = 0.6 + Math.random() * 0.4;

        confettiContainer.appendChild(piece);
      }
    }

    function burstConfetti() {
      createConfetti();
    }

    createConfetti();
  </script>

</body>
</html>
